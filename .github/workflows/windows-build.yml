name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify public source and synthetic board
        run: |
          python scripts/test_bom_import.py
          node scripts/test_bom_selection.cjs
          python scripts/test_board_appearance.py
          python scripts/test_bga.py
          python scripts/test_project_refresh.py
          python scripts/test_calibration_binding.py
          python scripts/test_model_binding.py
          node scripts/test_model_import_ui.cjs
          python scripts/test_board_cutouts.py
          node scripts/test_board_worker.mjs
          python src/app.py --self-test
          python scripts/verify_public.py
      - name: Build standalone EXE
        run: python build_exe.py --work-dir _work/exe_build --dist-dir dist
      - name: Assemble complete program directory
        shell: python
        run: |
          import shutil
          from pathlib import Path
          shutil.copytree('用户模型库', 'dist/用户模型库')
          shutil.copy2('aliases.json', 'dist/aliases.json')
      - name: Verify packaged EXE with external library
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          subprocess.run([str(Path('dist/PCBA3D.exe').resolve()), '--self-test'], check=True, timeout=180)
          data=json.loads(Path('dist/自检结果.json').read_text(encoding='utf8'))
          assert data['ok'] and data['models']==64 and data['sample'] is False, data
      - name: Generate synthetic board using EXE itself
        run: python scripts/verify_public_exe.py
      - name: Package EXE, external models and licenses
        run: python scripts/package_release.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: PCBA3D-Windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PCBA3D-validation
          path: |
            _work/public-verification.json
            自检结果.json
            dist/自检结果.json
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PCBA3D-Windows-x64
          path: package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" package/* --title "PCBA3D $TAG" --notes "Windows x64 完整程序包，含 64 种常规模型。非商业学习和评估可用；商用需事先取得书面授权，详见 LICENSE。第三方模型按原许可执行。输入为 BOM、XY、Gerber/Excellon；提供预览、手工贴片找料、校准、基础几何 DFM 与 STEP 导出。"
